<?xml version="1.0"?>
<!DOCTYPE window>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zoteroagy/content/katex.min.css" type="text/css"?>
<?xml-stylesheet href="chrome://zoteroagy/content/zoteroPane.css" type="text/css"?>

<window
  id="zoteroagy-standalone"
  title="AGY 智能助手 (Antigravity)"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  windowtype="zoteroagy:standalone"
  persist="screenX screenY width height"
  width="480"
  height="720"
  onload="if (window.arguments &amp;&amp; window.arguments[0] &amp;&amp; window.arguments[0].loadLock) window.arguments[0].loadLock.resolve();"
>
  <commandset id="editMenuCommands">
    <command id="cmd_undo" oncommand="goDoCommand('cmd_undo')" />
    <command id="cmd_redo" oncommand="goDoCommand('cmd_redo')" />
    <command id="cmd_cut" oncommand="goDoCommand('cmd_cut')" />
    <command id="cmd_copy" oncommand="goDoCommand('cmd_copy')" />
    <command id="cmd_paste" oncommand="goDoCommand('cmd_paste')" />
    <command id="cmd_delete" oncommand="goDoCommand('cmd_delete')" />
    <command id="cmd_selectAll" oncommand="goDoCommand('cmd_selectAll')" />
  </commandset>
  <keyset id="editMenuKeys">
    <key id="key_undo" key="z" modifiers="accel" command="cmd_undo" />
    <key id="key_redo" key="y" modifiers="accel" command="cmd_redo" />
    <key id="key_cut" key="x" modifiers="accel" command="cmd_cut" />
    <key id="key_copy" key="c" modifiers="accel" command="cmd_copy" />
    <key id="key_paste" key="v" modifiers="accel" command="cmd_paste" />
    <key id="key_selectAll" key="a" modifiers="accel" command="cmd_selectAll" />
  </keyset>
  <html:script src="chrome://zoteroagy/content/mermaid.min.js"></html:script>
  <html:body id="zoteroagy-standalone-root" style="height: 100%; width: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; box-sizing: border-box; background: var(--material-background, #f9f9fa); overflow: hidden; -moz-user-select: text; user-select: text;"></html:body>
</window>
