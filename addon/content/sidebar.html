<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGY 助手</title>
    <style>
        :root {
            /* Light theme */
            --bg-color: #ffffff;
            --text-color: #333333;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --header-bg: #f9f9f9;
            
            --user-bubble-bg: #4A90D9;
            --user-bubble-text: #ffffff;
            --ai-bubble-bg: #F0F0F0;
            --ai-bubble-text: #333333;
            
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --input-focus: #4A90D9;
            
            --tag-bg: #e6f3ff;
            --tag-text: #0066cc;
            
            --code-bg: #f5f5f5;
            --code-border: #dddddd;
            
            --button-hover: #e5e5e5;
            --scrollbar-thumb: #cccccc;
            --scrollbar-track: #f0f0f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme */
                --bg-color: #1e1e1e;
                --text-color: #eeeeee;
                --text-muted: #aaaaaa;
                --border-color: #444444;
                --header-bg: #2d2d2d;
                
                --user-bubble-bg: #4A90D9;
                --user-bubble-text: #ffffff;
                --ai-bubble-bg: #2d2d2d;
                --ai-bubble-text: #eeeeee;
                
                --input-bg: #2d2d2d;
                --input-border: #555555;
                --input-focus: #4A90D9;
                
                --tag-bg: #1a3a5c;
                --tag-text: #66b3ff;
                
                --code-bg: #111111;
                --code-border: #333333;
                
                --button-hover: #3d3d3d;
                --scrollbar-thumb: #555555;
                --scrollbar-track: #2d2d2d;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 20px;
        }

        .title {
            font-weight: 600;
            font-size: 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--button-hover);
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .login-btn, .logout-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .login-btn:hover, .logout-btn:hover {
            background-color: var(--button-hover);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: var(--user-bubble-bg);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* Chat Area */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .welcome-state {
            text-align: center;
            color: var(--text-muted);
            margin: auto;
            max-width: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .welcome-state .wave {
            font-size: 32px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .msg-user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-system {
            align-self: center;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            max-width: 90%;
            margin: 8px 0;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .msg-user .bubble {
            background-color: var(--user-bubble-bg);
            color: var(--user-bubble-text);
            border-top-right-radius: 4px;
        }

        .msg-ai .bubble {
            background-color: var(--ai-bubble-bg);
            color: var(--ai-bubble-text);
            border-top-left-radius: 4px;
        }

        .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .msg-actions {
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .action-btn:hover {
            color: var(--text-color);
        }

        /* Markdown Styles */
        .markdown-body p { margin-bottom: 8px; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body a { color: inherit; text-decoration: underline; }
        .markdown-body strong { font-weight: 600; }
        .markdown-body em { font-style: italic; }
        .markdown-body ul, .markdown-body ol { margin-left: 20px; margin-bottom: 8px; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { font-weight: 600; margin: 12px 0 8px 0; line-height: 1.25; }
        .markdown-body h1 { font-size: 1.2em; }
        .markdown-body h2 { font-size: 1.1em; }
        .markdown-body h3 { font-size: 1.05em; }
        .markdown-body blockquote { 
            border-left: 3px solid var(--border-color); 
            padding-left: 10px; 
            margin: 8px 0; 
            color: var(--text-muted);
        }
        .markdown-body code {
            background-color: rgba(0,0,0,0.1);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        @media (prefers-color-scheme: dark) {
            .markdown-body code { background-color: rgba(255,255,255,0.1); }
        }
        .markdown-body pre {
            background-color: var(--code-bg);
            border: 1px solid var(--code-border);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background-color: var(--ai-bubble-bg);
            border-radius: 18px;
            border-top-left-radius: 4px;
            width: fit-content;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-container {
            padding: 12px 15px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .context-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 0;
        }

        .context-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            max-width: 200px;
        }

        .context-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-context {
            background: none;
            border: none;
            color: var(--tag-text);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-context:hover {
            opacity: 0.7;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 6px 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.2);
        }

        textarea {
            flex-grow: 1;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            padding: 6px 0;
            outline: none;
            line-height: 1.4;
            min-height: 32px;
            overflow-y: auto;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background-color: var(--user-bubble-bg);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-bottom: 2px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .new-chat-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }
        
        .new-chat-btn:hover {
            color: var(--text-color);
        }
        
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <span class="logo">🤖</span>
            <span class="title">AGY 助手</span>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="history-btn" title="历史记录">🕒</button>
            <button class="icon-btn" id="settings-btn" title="设置">⚙️</button>
            <div class="user-area">
                <button class="login-btn" id="login-btn">登录</button>
                <div class="user-info" id="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <span id="user-name">User</span>
                    <button class="logout-btn" id="logout-btn">退出</button>
                </div>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="welcome-state" id="welcome-state">
            <span class="wave">👋</span>
            <h3>你好！我是 AGY AI 研究助手</h3>
            <p>选择一篇文献开始对话，或者直接向我提问。</p>
        </div>
        <!-- Messages will be injected here -->
    </div>

    <div class="input-container">
        <div class="context-bar" id="context-bar">
            <!-- Context tags will be injected here -->
        </div>
        <div class="input-box">
            <button class="new-chat-btn" id="new-chat-btn" title="新对话">➕</button>
            <textarea id="message-input" placeholder="输入消息... (Shift+Enter 换行)" rows="1"></textarea>
            <button class="send-btn" id="send-btn" title="发送">
                <span class="send-icon">▶</span>
                <div class="spinner"></div>
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const welcomeState = document.getElementById('welcome-state');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = document.querySelector('.send-icon');
        const spinner = document.querySelector('.spinner');
        const contextBar = document.getElementById('context-bar');
        
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        const userName = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        
        const settingsBtn = document.getElementById('settings-btn');
        const historyBtn = document.getElementById('history-btn');
        const newChatBtn = document.getElementById('new-chat-btn');

        // State
        let isGenerating = false;
        let currentAiMessageBubble = null;
        let currentAiMessageContent = '';
        let typingIndicator = null;
        let contexts = [];

        // Utilities
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Extremely basic markdown parser for the requested features
        function renderMarkdown(text) {
            if (!text) return '';
            
            let html = text
                // Escape HTML
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                
                // Code blocks
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                
                // Inline code
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                
                // Bold
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                
                // Italic
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                
                // Headers
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                
                // Blockquotes
                .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
                
                // Lists (simple)
                .replace(/^- (.*$)/gim, '<ul><li>$1</li></ul>')
                .replace(/<\/ul>\n<ul>/g, '\n') // Merge adjacent lists
                
                // Links
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                
                // Paragraphs and line breaks
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
                
            return `<div class="markdown-body"><p>${html}</p></div>`;
        }

        // Auto-grow textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value.trim() === '') {
                sendBtn.disabled = true;
            } else {
                sendBtn.disabled = false;
            }
        });

        // Keydown handling (Enter to send, Shift+Enter for newline)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Message Creation UI
        function appendUserMessage(text) {
            welcomeState.style.display = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message msg-user';
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.textContent = text;
            
            msgDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }
        
        function appendSystemMessage(text) {
            welcomeState.style.display = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message msg-system';
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            welcomeState.style.display = 'none';
            if (typingIndicator) return;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message msg-ai';
            msgDiv.id = 'typing-indicator';
            
            const indDiv = document.createElement('div');
            indDiv.className = 'typing-indicator';
            indDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            
            msgDiv.appendChild(indDiv);
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            typingIndicator = msgDiv;
        }

        function removeTypingIndicator() {
            if (typingIndicator) {
                typingIndicator.remove();
                typingIndicator = null;
            }
        }

        function startAiMessage() {
            removeTypingIndicator();
            isGenerating = true;
            currentAiMessageContent = '';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message msg-ai';
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble markdown-body';
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'msg-actions';
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.innerHTML = '📋 复制';
            copyBtn.onclick = () => {
                window.parent.postMessage({ type: 'copy-message', content: currentAiMessageContent }, '*');
                copyBtn.innerHTML = '✅ 已复制';
                setTimeout(() => copyBtn.innerHTML = '📋 复制', 2000);
            };
            
            const noteBtn = document.createElement('button');
            noteBtn.className = 'action-btn';
            noteBtn.innerHTML = '📝 存笔记';
            noteBtn.onclick = () => {
                window.parent.postMessage({ type: 'save-to-note', content: currentAiMessageContent }, '*');
            };
            
            actionsDiv.appendChild(copyBtn);
            actionsDiv.appendChild(noteBtn);
            
            msgDiv.appendChild(bubbleDiv);
            msgDiv.appendChild(actionsDiv);
            
            chatContainer.appendChild(msgDiv);
            currentAiMessageBubble = bubbleDiv;
            scrollToBottom();
        }

        function appendAiStreamChunk(chunk) {
            if (!currentAiMessageBubble) {
                startAiMessage();
            }
            currentAiMessageContent += chunk;
            currentAiMessageBubble.innerHTML = renderMarkdown(currentAiMessageContent);
            scrollToBottom();
        }

        function finishAiMessage() {
            isGenerating = false;
            currentAiMessageBubble = null;
            sendIcon.style.display = 'block';
            spinner.style.display = 'none';
        }

        // Actions
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isGenerating) return;
            
            appendUserMessage(text);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            sendIcon.style.display = 'none';
            spinner.style.display = 'block';
            
            window.parent.postMessage({
                type: 'send-message',
                content: text,
                contextIds: contexts.map(c => c.id)
            }, '*');
            
            showTypingIndicator();
        }
        
        function updateContextUI() {
            contextBar.innerHTML = '';
            contexts.forEach(ctx => {
                const tag = document.createElement('div');
                tag.className = 'context-tag';
                tag.innerHTML = `
                    <span class="context-text" title="${ctx.title}">${ctx.title}</span>
                    <button class="remove-context" data-id="${ctx.id}">×</button>
                `;
                contextBar.appendChild(tag);
                
                tag.querySelector('.remove-context').addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    contexts = contexts.filter(c => c.id !== id);
                    updateContextUI();
                    window.parent.postMessage({ type: 'remove-context', id: id }, '*');
                });
            });
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        
        loginBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'login' }, '*');
        });
        
        logoutBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'logout' }, '*');
        });
        
        settingsBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'open-settings' }, '*');
        });
        
        newChatBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'new-conversation' }, '*');
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeState);
            welcomeState.style.display = 'flex';
        });

        // Initial setup
        sendBtn.disabled = true;

        // PostMessage Listener
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data) return;
            
            switch (data.type) {
                case 'auth-update':
                    if (data.isLoggedIn) {
                        loginBtn.style.display = 'none';
                        userInfo.style.display = 'flex';
                        userName.textContent = data.name || 'User';
                        userAvatar.textContent = (data.name || 'U').charAt(0).toUpperCase();
                    } else {
                        loginBtn.style.display = 'block';
                        userInfo.style.display = 'none';
                    }
                    break;
                    
                case 'stream-chunk':
                    appendAiStreamChunk(data.chunk || '');
                    if (data.done) {
                        finishAiMessage();
                    }
                    break;
                    
                case 'add-context':
                    if (data.context && !contexts.find(c => c.id === data.context.id)) {
                        contexts.push(data.context);
                        updateContextUI();
                    }
                    break;
                    
                case 'clear-contexts':
                    contexts = [];
                    updateContextUI();
                    break;
                    
                case 'system-message':
                    appendSystemMessage(data.message);
                    break;
                    
                case 'load-conversation':
                    // Clear current UI
                    chatContainer.innerHTML = '';
                    chatContainer.appendChild(welcomeState);
                    welcomeState.style.display = 'none';
                    
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            if (msg.role === 'user') {
                                appendUserMessage(msg.content);
                            } else if (msg.role === 'ai' || msg.role === 'assistant') {
                                // Direct render without stream
                                const msgDiv = document.createElement('div');
                                msgDiv.className = 'message msg-ai';
                                
                                const bubbleDiv = document.createElement('div');
                                bubbleDiv.className = 'bubble markdown-body';
                                bubbleDiv.innerHTML = renderMarkdown(msg.content);
                                
                                const actionsDiv = document.createElement('div');
                                actionsDiv.className = 'msg-actions';
                                
                                const copyBtn = document.createElement('button');
                                copyBtn.className = 'action-btn';
                                copyBtn.innerHTML = '📋 复制';
                                copyBtn.onclick = () => {
                                    window.parent.postMessage({ type: 'copy-message', content: msg.content }, '*');
                                };
                                
                                const noteBtn = document.createElement('button');
                                noteBtn.className = 'action-btn';
                                noteBtn.innerHTML = '📝 存笔记';
                                noteBtn.onclick = () => {
                                    window.parent.postMessage({ type: 'save-to-note', content: msg.content }, '*');
                                };
                                
                                actionsDiv.appendChild(copyBtn);
                                actionsDiv.appendChild(noteBtn);
                                
                                msgDiv.appendChild(bubbleDiv);
                                msgDiv.appendChild(actionsDiv);
                                chatContainer.appendChild(msgDiv);
                            }
                        });
                        scrollToBottom();
                    } else {
                        welcomeState.style.display = 'flex';
                    }
                    break;
            }
        });
    </script>
</body>
</html>
